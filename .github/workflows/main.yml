name: Build TR.SUB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP project automatically
        shell: bash
        run: |
          set -e

          mkdir -p extracted_project

          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting project: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "No ZIP found. Checking repository files."
          fi

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Android Gradle project found."
            echo "Files available in repository:"
            find . -maxdepth 5 -type f | head -n 150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Gradle wrapper is missing."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TR-SUB-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
