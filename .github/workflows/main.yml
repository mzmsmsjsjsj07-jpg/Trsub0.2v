name: Build TR.SUB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP project automatically
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP files..."
          find . -type f -iname "*.zip" -not -path "./.git/*" -print

          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "No ZIP file found; checking existing repository files."
          fi

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -not -path "./.git/*" \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Android Gradle project found."
            echo "Make sure the ZIP contains the actual Android project."
            exit 
